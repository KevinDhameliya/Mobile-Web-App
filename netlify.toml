# Netlify configuration — https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Tests run first: a failing balance calculation blocks the deploy.
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: any path without a matching static file serves index.html so
# React Router can resolve it (direct links and refreshes on nested routes).
# Status 200 rewrites never shadow real files such as /sw.js or /assets/*.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Security headers (all routes)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    # The app talks only to its own origin and the Supabase project used for
    # cloud sync. Data is kept in IndexedDB and synced to Supabase when signed in.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://ubymovosfskkndmfrmxn.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# ---------------------------------------------------------------------------
# Caching headers — chosen so PWA updates are never blocked
# ---------------------------------------------------------------------------

# Content-hashed build output: safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker and Workbox runtime: always revalidate so new deployments
# are detected immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# HTML entry points: always revalidate.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/theme-init.js"
  [headers.values]
    Cache-Control = "no-cache"

# Icons are not content-hashed; cache for a day.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
