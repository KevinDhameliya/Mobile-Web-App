<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · Mobile Web App</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #f8fafc; --card: #fff; --fg: #0f172a; --muted: #475569; --brand: #4f46e5; --border: #e2e8f0; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0b14; --card: #151524; --fg: #f1f5f9; --muted: #a3acc0; --brand: #818cf8; --border: #262640; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
             font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
      main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px 24px; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 1.375rem; margin: 20px 0 8px; }
      p { color: var(--muted); line-height: 1.55; margin: 0 0 24px; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 12px;
          background: var(--brand); color: #fff; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/pwa-192x192.png" alt="" />
      <h1>You're offline</h1>
      <p>This page couldn't be loaded because your device isn't connected to the internet. Check your connection and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
